<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Claude で開く</title>
<style>
  :root { color-scheme: light dark; --fg: #1f1f1f; --bg: #faf9f5; --muted: #6b6b6b; --accent: #c96442; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ececec; --bg: #1f1e1d; --muted: #a3a3a3; } }
  body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--fg); font: 16px/1.7 system-ui, "Yu Gothic UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; }
  code { word-break: break-all; }
  a.button { display: inline-block; margin-top: 16px; padding: 10px 20px; border-radius: 8px; background: var(--accent); color: #fff; text-decoration: none; }
  .muted { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Claude で開く</h1>
  <p id="msg">リンクを読み込んでいます…</p>
  <p id="folder"></p>
  <a id="open" class="button" hidden>Claude アプリで開く</a>
  <p class="muted">Notion から Claude デスクトップアプリの Code タブを開くための中継ぎページです。フォルダー名は URL の # より後ろにあり、サーバーには送られません。</p>
</main>
<script>
  // #folder=<絶対パス>&q=<最初の依頼文> を claude://code/new に渡すだけ。ほかの宛先には飛ばさない
  const p = new URLSearchParams(location.hash.slice(1));
  const folder = p.get('folder') || '';
  const q = p.get('q') || '';
  const msg = document.getElementById('msg');
  // Windows（D:\…）と Mac（/Users/…）のフォルダーだけ通す
  if (!/^([A-Za-z]:\\|\/Users\/)[^\0]*$/.test(folder) || folder.includes('..')) {
    msg.textContent = 'フォルダーの指定がありません（または正しくありません）。';
  } else {
    const url = 'claude://code/new?folder=' + encodeURIComponent(folder) + (q ? '&q=' + encodeURIComponent(q) : '');
    document.getElementById('folder').innerHTML = 'フォルダー：<code></code>';
    document.querySelector('#folder code').textContent = folder;
    const a = document.getElementById('open');
    a.href = url;
    a.hidden = false;
    msg.textContent = 'Claude アプリを開いています。開かないときは下のボタンを押してください。';
    location.href = url;
  }
</script>
</body>
</html>
